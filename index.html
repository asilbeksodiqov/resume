<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2efe7">
<title>Asilbek Sodiqov — Data Analyst · Resume</title>
<meta name="description" content="Asilbek Sodiqov — Data Analyst. Resume.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@100..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="boot">
<div class="grain"></div>

<!-- Sahnalar script.js tomonidan RESUME ma'lumotlaridan yig'iladi -->
<main id="stage"></main>

<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

<div class="hud">
  <div class="hud-top">
    <div class="id"><b id="hName"></b><span id="hRole"></span></div>
    <div class="hud-right">
      <i class="rec" aria-hidden="true"></i>
      <span class="tc" id="tc" aria-hidden="true">00:00:00<i class="fr">:00</i></span>
      <button class="pill" id="printBtn" type="button">PDF ↓</button>
    </div>
  </div>
  <div class="hud-bot">
    <button class="pp" id="pp" type="button" data-s="pause" aria-label="Pauza">
      <svg class="i-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
      <svg class="i-replay" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.1M2.5 2.5v3.2h3.2"/></svg>
    </button>
    <div class="track" id="track" role="group" aria-label="Sahnalar"></div>
    <div class="now"><span id="sceneName"></span><b id="cnum"></b></div>
  </div>
</div>

<div class="toast" id="toast"><kbd>Space</kbd> pauza &nbsp;·&nbsp; <kbd>← →</kbd> sahnalar &nbsp;·&nbsp; <kbd>R</kbd> boshidan</div>

<div class="cur" id="curRing"><div class="cur-ring" id="ring"></div></div>
<div class="cur" id="curDot"><div class="cur-dot"></div></div>

<script src="script.js"></script>
</body>
</html>
